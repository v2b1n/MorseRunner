[package]
name = "morse-runner"
version = "1.1.0"
edition = "2021"
license = "MPL-2.0"
description = "CW contest practice simulator"
repository = "https://github.com/v2b1n/MorseRunner"
readme = "README.md"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
cpal = "0.15.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
dirs = "6"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }
