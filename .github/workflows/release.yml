name: Cross-platform CI and main pre-releases

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare-build-metadata:
    name: Compute version and changelog snapshot
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      base_sha: ${{ steps.metadata.outputs.base_sha }}
    steps:
      - name: Check out the exact build source and history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Compute shared CI version
        id: version
        run: python3 packaging/compute-build-version.py

      - name: Generate changelog and build metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          MORSE_RUNNER_BUILD_VERSION: ${{ steps.version.outputs.version }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: python3 packaging/generate-build-metadata.py

      - name: Upload immutable run metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: morse-runner-metadata
          path: dist/metadata/*
          overwrite: true
          if-no-files-found: error
          retention-days: 30

  build-debian:
    name: Test and build Debian 13 package (amd64)
    needs: [prepare-build-metadata]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download this run's changelog snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: morse-runner-metadata
          path: dist/metadata

      - name: Format, lint, test and build in clean Debian 13
        env:
          MORSE_RUNNER_BUILD_VERSION: ${{ needs.prepare-build-metadata.outputs.version }}
          MORSE_RUNNER_BUILD_KIND: ci
        run: |
          docker run --rm \
            --env MORSE_RUNNER_BUILD_VERSION \
            --env MORSE_RUNNER_BUILD_KIND \
            --env MORSE_RUNNER_CHANGELOG_FILE=/work/dist/metadata/CHANGELOG.md \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            debian:trixie-slim \
            bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install --yes --no-install-recommends \
                build-essential ca-certificates curl dpkg-dev git lintian python3 \
                libasound2-dev libgl1-mesa-dev libwayland-dev \
                libx11-dev libxcursor-dev libxi-dev libxinerama-dev \
                libxkbcommon-dev libxrandr-dev pkg-config
              git config --global --add safe.directory /work
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain stable
              export PATH="$HOME/.cargo/bin:$PATH"
              rustup component add rustfmt clippy
              cargo fmt --all -- --check
              cargo clippy --locked --all-targets -- -D warnings
              cargo test --locked
              cargo install --locked --features cli cargo-about
              ./packaging/build-deb.sh
              lintian --tag-display-limit 0 --fail-on error dist/morse-runner_*_amd64.deb
              ./packaging/build-linux-tarball.sh "dist/morse-runner_${MORSE_RUNNER_BUILD_VERSION}_amd64.deb"
            '

      - name: Upload this run's Debian package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: morse-runner-debian
          path: |
            dist/morse-runner_*_amd64.deb
            dist/morse-runner_*_linux_amd64.tar.gz
          overwrite: true
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Test and package Windows 10/11 (x86_64)
    needs: [prepare-build-metadata]
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}

      - name: Download this run's changelog snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: morse-runner-metadata
          path: dist/metadata

      - name: Install Rust stable for x86_64 MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
          Invoke-WebRequest -Uri 'https://win.rustup.rs/x86_64' -OutFile $installer
          & $installer -y --profile minimal --default-host x86_64-pc-windows-msvc --default-toolchain stable
          if ($LASTEXITCODE -ne 0) { throw "rustup-init failed: $LASTEXITCODE" }
          $cargoBin = Join-Path $env:USERPROFILE '.cargo\bin'
          "$cargoBin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $env:PATH = "$cargoBin;$env:PATH"
          rustup component add rustfmt clippy

      - name: Format, lint, test, build and assemble Windows installer
        shell: pwsh
        env:
          MORSE_RUNNER_BUILD_VERSION: ${{ needs.prepare-build-metadata.outputs.version }}
          MORSE_RUNNER_BUILD_KIND: ci
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'cargo fmt failed' }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'cargo clippy failed' }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { throw 'cargo test failed' }
          cargo build --locked --release
          if ($LASTEXITCODE -ne 0) { throw 'cargo build failed' }
          $exe = [System.IO.File]::ReadAllBytes((Resolve-Path 'target/release/morse-runner.exe'))
          $peOffset = [BitConverter]::ToInt32($exe, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($exe, $peOffset + 24 + 68)
          if ($subsystem -ne 2) { throw "Expected Windows GUI subsystem (2), got $subsystem" }
          cargo install --locked --features cli cargo-about
          if ($LASTEXITCODE -ne 0) { throw 'cargo-about install failed' }
          New-Item -ItemType Directory -Force -Path target, dist | Out-Null
          cargo about generate --fail about.hbs --output-file target/THIRD_PARTY-LICENSES.md
          if ($LASTEXITCODE -ne 0) { throw 'cargo about failed' }
          $version = $env:MORSE_RUNNER_BUILD_VERSION
          if ([string]::IsNullOrWhiteSpace($version) -or
              $version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'MORSE_RUNNER_BUILD_VERSION must be MAJOR.MINOR.PATCH'
          }
          $stage = Join-Path $env:RUNNER_TEMP 'morse-runner-installer'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/morse-runner.exe $stage/
          Copy-Item -Path @('README.md', 'LICENSE', 'THIRD_PARTY.md', 'target/THIRD_PARTY-LICENSES.md', 'dist/metadata/CHANGELOG.md', 'dist/metadata/BUILD-INFO.json') -Destination $stage
          $portableName = "morse-runner_${version}_windows_x86_64.zip"
          $portableZip = Join-Path (Resolve-Path dist) $portableName
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $portableZip -CompressionLevel Optimal
          $archive = [System.IO.Compression.ZipFile]::OpenRead($portableZip)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName })
            foreach ($required in @('morse-runner.exe', 'README.md', 'LICENSE', 'THIRD_PARTY.md', 'THIRD_PARTY-LICENSES.md', 'CHANGELOG.md')) {
              if ($entries -notcontains $required) { throw "Portable ZIP is missing $required" }
            }
          }
          finally { $archive.Dispose() }
          $setupName = "morse-runner_${version}_windows_x86_64_setup"
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler was not found on the Windows runner' }
          & $iscc "/DAppVersion=$version" "/DStageDir=$stage" "/DOutputBaseFilename=$setupName" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          $setup = Join-Path (Resolve-Path dist) "$setupName.exe"
          $installDir = Join-Path $env:RUNNER_TEMP 'morse-runner-install-smoke'
          $installed = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$installDir") -Wait -PassThru
          if ($installed.ExitCode -ne 0 -or -not (Test-Path (Join-Path $installDir 'morse-runner.exe'))) { throw 'Inno Setup install smoke test failed' }
          $uninstalled = Start-Process -FilePath (Join-Path $installDir 'unins000.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($uninstalled.ExitCode -ne 0 -or (Test-Path $installDir)) { throw 'Inno Setup uninstall smoke test failed' }

      - name: Upload this run's Windows portable archive and installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: morse-runner-windows
          path: |
            dist/morse-runner_*_windows_x86_64.zip
            dist/morse-runner_*_windows_x86_64_setup.exe
          overwrite: true
          if-no-files-found: error
          retention-days: 30

  attest-main-artifacts:
    name: Attest the Linux and Windows release packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-debian, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download this run's Debian packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: morse-runner-debian
          path: dist/debian

      - name: Download this run's Windows packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: morse-runner-windows
          path: dist/windows

      - name: Generate GitHub build provenance attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/debian/morse-runner_*.deb,dist/debian/morse-runner_*_linux_amd64.tar.gz,dist/windows/morse-runner_*_windows_x86_64.zip,dist/windows/morse-runner_*_windows_x86_64_setup.exe

  publish-main-prerelease:
    name: Publish this main build as a pre-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [prepare-build-metadata, build-debian, build-windows, attest-main-artifacts]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Check out exact source and tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download this run's packages and metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist/downloads

      - name: Assemble and publish immutable pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          MORSE_RUNNER_BUILD_VERSION: ${{ needs.prepare-build-metadata.outputs.version }}
          EXPECTED_SOURCE_SHA: ${{ needs.prepare-build-metadata.outputs.source_sha }}
          EXPECTED_BASE_SHA: ${{ needs.prepare-build-metadata.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$EXPECTED_SOURCE_SHA" = "$GITHUB_SHA"
          mkdir -p dist/release
          cp dist/downloads/morse-runner-debian/morse-runner_*.deb dist/release/
          cp dist/downloads/morse-runner-debian/morse-runner_*_linux_amd64.tar.gz dist/release/
          cp dist/downloads/morse-runner-windows/morse-runner_*_windows_x86_64.zip dist/release/
          cp dist/downloads/morse-runner-windows/morse-runner_*.exe dist/release/
          cp dist/downloads/morse-runner-metadata/CHANGELOG.md dist/release/
          cp dist/downloads/morse-runner-metadata/BUILD-INFO.json dist/release/
          shopt -s nullglob
          packages=(dist/release/morse-runner_*)
          ((${#packages[@]} == 4))
          for package in "${packages[@]}"; do
            gh attestation verify "$package" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
          cd dist/release
          python3 - "$MORSE_RUNNER_BUILD_VERSION" "$EXPECTED_SOURCE_SHA" "$EXPECTED_BASE_SHA" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          version, source_sha, base_sha = sys.argv[1:]
          info = json.loads(Path("BUILD-INFO.json").read_text(encoding="utf-8"))
          if info.get("version") != version or info.get("source_sha") != source_sha or info.get("base_sha") != base_sha:
              raise SystemExit("BUILD-INFO.json does not match this workflow run")
          if info.get("kind") != "ci" or info.get("run_number") != int(version.rsplit(".", 1)[1]):
              raise SystemExit("BUILD-INFO.json has an inconsistent build version")
          if not re.fullmatch(r"[0-9a-f]{40}", source_sha) or not re.fullmatch(r"[0-9a-f]{40}", base_sha):
              raise SystemExit("BUILD-INFO.json contains an invalid commit SHA")
          if info.get("github_artifact_attestations") is not True:
              raise SystemExit("GitHub Artifact Attestations are not confirmed in build metadata")
          PY
          changelog_hash="$(sha256sum CHANGELOG.md | cut -d' ' -f1)"
          test "$changelog_hash" = "$(python3 -c 'import json; print(json.load(open("BUILD-INFO.json"))["changelog_sha256"])')"
          expected_deb="morse-runner_${MORSE_RUNNER_BUILD_VERSION}_amd64.deb"
          expected_tar="morse-runner_${MORSE_RUNNER_BUILD_VERSION}_linux_amd64.tar.gz"
          expected_zip="morse-runner_${MORSE_RUNNER_BUILD_VERSION}_windows_x86_64.zip"
          expected_exe="morse-runner_${MORSE_RUNNER_BUILD_VERSION}_windows_x86_64_setup.exe"
          test -s "$expected_deb"
          test -s "$expected_tar"
          test -s "$expected_zip"
          test -s "$expected_exe"
          sha256sum "$expected_deb" "$expected_tar" "$expected_zip" "$expected_exe" BUILD-INFO.json CHANGELOG.md > SHA256SUMS
          sha256sum --check SHA256SUMS

          tag="v${MORSE_RUNNER_BUILD_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite it." >&2
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Git tag $tag already exists; refusing to reuse it." >&2
            exit 1
          fi

          # GitHub defers creating the git ref for a draft release when the tag
          # is absent, so push the source-bound tag before making the draft.
          git -c tag.gpgSign=false tag "$tag" "$EXPECTED_SOURCE_SHA"
          git push origin "refs/tags/$tag"
          git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git rev-parse "$tag^{commit}")" = "$EXPECTED_SOURCE_SHA"

          gh release create "$tag" \
            --draft \
            --verify-tag \
            --title "MorseRunner $MORSE_RUNNER_BUILD_VERSION" \
            --notes-file CHANGELOG.md
          gh release upload "$tag" \
            "$expected_deb" "$expected_tar" "$expected_zip" "$expected_exe" BUILD-INFO.json CHANGELOG.md SHA256SUMS

          test "$(git rev-parse "$tag^{commit}")" = "$EXPECTED_SOURCE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          python3 - "$tag" releases.json release-draft.json <<'PY'
          import json
          import sys
          from pathlib import Path

          tag, releases_path, draft_path = sys.argv[1:]
          releases = json.loads(Path(releases_path).read_text(encoding="utf-8"))
          matches = [release for release in releases if release.get("tag_name") == tag]
          if len(matches) != 1:
              raise SystemExit(f"Expected one release for {tag}, found {len(matches)}")
          release = matches[0]
          if release.get("draft") is not True or release.get("prerelease") is not False:
              raise SystemExit(f"Release {tag} is not the expected unpublished draft")
          Path(draft_path).write_text(json.dumps(release), encoding="utf-8")
          PY
          python3 "$GITHUB_WORKSPACE/packaging/verify-main-prerelease.py" draft \
            --version "$MORSE_RUNNER_BUILD_VERSION" \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --base-sha "$EXPECTED_BASE_SHA" \
            --release-json release-draft.json \
            --assets-dir . \
            --snapshot "$RUNNER_TEMP/pre-release-snapshot.json"

          release_id="$(python3 -c 'import json; print(json.load(open("release-draft.json"))["id"])')"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false -F prerelease=true > release-published.json
          python3 "$GITHUB_WORKSPACE/packaging/verify-main-prerelease.py" published \
            --release-json release-published.json \
            --snapshot "$RUNNER_TEMP/pre-release-snapshot.json"
