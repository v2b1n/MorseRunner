name: Release
run-name: Promote MorseRunner ${{ inputs.version }} to stable

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version of an existing main-branch pre-release, without the v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    name: Verify signed manifest and promote existing assets
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read
    concurrency:
      group: morse-runner-release-promotion-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - name: Check out the release workflow and history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Validate request and find the existing pre-release
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tag="v$VERSION"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$RUNNER_TEMP/release-before.json"
          python3 - "$RUNNER_TEMP/release-before.json" "$tag" <<'PY'
          import json
          import sys
          from pathlib import Path

          release = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if release.get("tag_name") != sys.argv[2] or release.get("draft") or not release.get("prerelease"):
              raise SystemExit("The requested version must identify an existing published pre-release")
          PY
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$RUNNER_TEMP/release-before.json")" >> "$GITHUB_OUTPUT"

      - name: Download assets from the existing pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.request.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-assets"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/release-assets"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-before.json"
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          source_sha="$(git rev-parse "$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$source_sha" refs/remotes/origin/main
          git show "$source_sha:Cargo.toml" > "$RUNNER_TEMP/source-Cargo.toml"
          echo "source_sha=$source_sha" >> "$GITHUB_ENV"

      - name: Verify immutable assets, source and checksums
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ steps.request.outputs.tag }}
        run: |
          set -euo pipefail
          python3 packaging/verify-release-publication.py before \
            --version "$VERSION" \
            --release-json "$RUNNER_TEMP/release-before.json" \
            --assets-dir "$RUNNER_TEMP/release-assets" \
            --tag-sha "$source_sha" \
            --source-cargo "$RUNNER_TEMP/source-Cargo.toml" \
            --snapshot "$RUNNER_TEMP/release-snapshot.json"

      - name: Verify maintainer signature on SHA256SUMS
        env:
          RELEASE_TAG: ${{ steps.request.outputs.tag }}
        run: |
          set -euo pipefail
          expected=C73C58F2A4662E48537C77CD17E233FD523708C0
          export GNUPGHOME="$RUNNER_TEMP/release-verify-gnupg"
          install -d -m 700 "$GNUPGHOME"
          curl --proto '=https' --tlsv1.2 -sSf https://github.com/v2b1n.gpg | gpg --batch --import
          actual="$(gpg --batch --with-colons --fingerprint "$expected" \
            | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$actual" = "$expected"
          gpg --batch --status-fd 1 --verify \
            "$RUNNER_TEMP/release-assets/SHA256SUMS.asc" \
            "$RUNNER_TEMP/release-assets/SHA256SUMS" > "$RUNNER_TEMP/signature-status"
          grep -Eq "^\[GNUPG:\] VALIDSIG [^ ]+ .* $expected$" "$RUNNER_TEMP/signature-status"

      - name: Verify GitHub Artifact Attestations for release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=("$RUNNER_TEMP"/release-assets/morse-runner_*.deb \
            "$RUNNER_TEMP"/release-assets/morse-runner_*_linux_amd64.tar.gz \
            "$RUNNER_TEMP"/release-assets/morse-runner_*_windows_x86_64.zip \
            "$RUNNER_TEMP"/release-assets/morse-runner_*_windows_x86_64_setup.exe)
          ((${#packages[@]} == 4))
          for package in "${packages[@]}"; do
            gh attestation verify "$package" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done

      - name: Promote the same publication without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.request.outputs.release_id }}
          RELEASE_TAG: ${{ steps.request.outputs.tag }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F prerelease=false -F make_latest=true \
            > "$RUNNER_TEMP/release-after.json"
          python3 packaging/verify-release-publication.py after \
            --release-json "$RUNNER_TEMP/release-after.json" \
            --snapshot "$RUNNER_TEMP/release-snapshot.json"
          echo "Promoted $RELEASE_TAG. Release ID, notes, tag and every asset digest stayed unchanged."
