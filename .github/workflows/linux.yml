name: Debian CI and release package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing owner-signed annotated tag to build and stage as a draft
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-release-tag:
    name: Verify owner-approved release source
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.verify.outputs.release_tag }}
      source_sha: ${{ steps.verify.outputs.source_sha }}
    steps:
      - name: Check out requested release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          fetch-depth: 0

      - name: Verify repository visibility, owner tag, source and version
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          EXPECTED_TAG_SHA: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.sha || '' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test "$GITHUB_REF" = refs/heads/main
          else
            test "$GITHUB_EVENT_NAME" = push
            test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

          # Public visibility is required for free public-repository attestations.
          repo_visibility="$(curl --proto '=https' --tlsv1.2 -sSf \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["visibility"])')"
          test "$repo_visibility" = public

          # Restore the remote annotated object in case checkout left its peeled commit at refs/tags/<tag>.
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$tag_commit"
          if [[ -n "$EXPECTED_TAG_SHA" ]]; then
            test "$tag_commit" = "$EXPECTED_TAG_SHA"
          fi
          test -z "$(git status --porcelain)"

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main

          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -1)"
          test "$RELEASE_TAG" = "v$version"
          grep -Fq "## [$version]" CHANGELOG.md

          expected_fingerprint=C73C58F2A4662E48537C77CD17E233FD523708C0
          export GNUPGHOME="$RUNNER_TEMP/release-gnupg"
          install -d -m 700 "$GNUPGHOME"
          curl --proto '=https' --tlsv1.2 -sSf https://github.com/v2b1n.gpg \
            | gpg --batch --import
          actual_fingerprint="$(gpg --batch --with-colons --fingerprint "$expected_fingerprint" \
            | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$actual_fingerprint" = "$expected_fingerprint"

          status_file="$RUNNER_TEMP/tag-verification-status"
          git -c gpg.format=openpgp verify-tag --raw "$RELEASE_TAG" 2>"$status_file"
          cat "$status_file"
          grep -Eq "^\\[GNUPG:\\] VALIDSIG [^ ]+ .* $expected_fingerprint$" "$status_file"

          # Never start a release build if a release already exists for this tag.
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          test "$status" = 404

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$tag_commit" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: Test and build Debian 13 package (amd64)
    needs: [verify-release-tag]
    if: >-
      always() &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       needs.verify-release-tag.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', needs.verify-release-tag.outputs.release_tag) || github.ref }}
          fetch-depth: 0

      - name: Confirm release build uses the verified tag commit
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.verify-release-tag.outputs.source_sha }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Format, lint, test and build in clean Debian 13
        run: |
          # Keep the runner-owned directory writable for the post-build hash step.
          mkdir -p "$GITHUB_WORKSPACE/dist"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            debian:trixie-slim \
            bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install --yes --no-install-recommends \
                build-essential ca-certificates curl dpkg-dev git lintian python3 \
                libasound2-dev libgl1-mesa-dev libwayland-dev \
                libx11-dev libxcursor-dev libxi-dev libxinerama-dev \
                libxkbcommon-dev libxrandr-dev pkg-config
              git config --global --add safe.directory /work
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain stable
              export PATH="$HOME/.cargo/bin:$PATH"
              rustup component add rustfmt clippy
              cargo fmt --all -- --check
              cargo clippy --locked --all-targets -- -D warnings
              cargo test --locked
              cargo install --locked --features cli cargo-about
              ./packaging/build-deb.sh
              lintian --tag-display-limit 0 --fail-on error dist/morse-runner_*_amd64.deb
            '

      - name: Record hashes for all release artifacts
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          artifacts=(morse-runner_*)
          ((${#artifacts[@]} > 0))
          sha256sum "${artifacts[@]}" > BUILD-SHA256SUMS

      - name: Upload built release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: morse-runner-release-artifacts
          path: |
            dist/morse-runner_*
            dist/BUILD-SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  attest-release-artifacts:
    name: Attest built release artifacts
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    needs: [verify-release-tag, build-and-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download artifacts from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: morse-runner-release-artifacts
          path: dist

      - name: Verify artifact hashes before attesting
        run: cd dist && sha256sum --check BUILD-SHA256SUMS

      - name: Generate GitHub build provenance attestations
        uses: actions/attest@v4
        with:
          subject-path: dist/morse-runner_*

  stage-draft-release:
    name: Verify artifacts and stage draft release
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    needs: [verify-release-tag, build-and-test, attest-release-artifacts]
    runs-on: ubuntu-24.04
    concurrency:
      group: official-release-${{ needs.verify-release-tag.outputs.release_tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Check out verified release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-release-tag.outputs.release_tag }}
          fetch-depth: 0

      - name: Confirm checkout matches verified source
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.verify-release-tag.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Download artifacts from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: morse-runner-release-artifacts
          path: dist

      - name: Verify exact build hashes and artifact attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check BUILD-SHA256SUMS
          shopt -s nullglob
          artifacts=(morse-runner_*)
          ((${#artifacts[@]} > 0))
          for artifact in "${artifacts[@]}"; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/linux.yml"
          done

      - name: Refuse to modify an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify-release-tag.outputs.release_tag }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          test "$status" = 404

      - name: Create final checksums and release notes
        env:
          RELEASE_TAG: ${{ needs.verify-release-tag.outputs.release_tag }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum morse-runner_* > SHA256SUMS
          cd ..
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          cargo = Path("Cargo.toml").read_text()
          match = re.search(r'^version = "([^\"]+)"$', cargo, re.M)
          if not match or tag != f"v{match.group(1)}":
              raise SystemExit("Release tag must match the Cargo.toml version")
          changelog = Path("CHANGELOG.md").read_text()
          heading = re.compile(rf"^## \[{re.escape(match.group(1))}\](?:\s+-.*)?\s*$", re.M)
          start = heading.search(changelog)
          if not start:
              raise SystemExit("CHANGELOG.md has no section for this release")
          end = re.search(r"^## ", changelog[start.end():], re.M)
          body = changelog[start.end():start.end() + end.start()] if end else changelog[start.end():]
          Path("dist/RELEASE_NOTES.md").write_text(body.strip() + "\n")
          PY

      - name: Create new draft release only
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify-release-tag.outputs.release_tag }}
          draft: true
          make_latest: false
          overwrite_files: false
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/morse-runner_*
            dist/SHA256SUMS
